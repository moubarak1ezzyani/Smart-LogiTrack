version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logitrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    build: .
    command: bash -c "./init_airflow.sh && airflow webserver --port 8080 -D && airflow scheduler"
    volumes:
      - ./dags:/root/airflow/dags
      - ./data:/opt/project/data
      - ./scripts:/opt/project/scripts
      - ./models:/opt/project/models
      - ./app:/opt/project/app
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://user:password@postgres/logitrack
      - PYTHONPATH=/opt/project
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/opt/project/app
      - ./models:/opt/project/models
    environment:
      - DATABASE_URL=postgresql://user:password@postgres/logitrack
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data: